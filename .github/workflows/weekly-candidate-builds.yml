name: Monday-only staged Pico and ESP32-S3 firmware

# Build and validate in this distribution repository; only the scheduled Monday
# event is permitted to publish TEST candidates into TestBuilds/.
# Stable release assets and stable board directories are never overwritten.
# Source commits are immutable/pinned; no branch-tip build drift.
# The C3 port is excluded until its fixed USB Serial/JTAG transport is built.
on:
  schedule:
    - cron: '53 4 * * 1' # Mondays 04:53 UTC; after stable Pico builds
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-candidate-builds.yml'

permissions:
  contents: read

concurrency:
  group: weekly-unvalidated-debugger-candidates
  cancel-in-progress: false

jobs:
  frozen-pico:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: pico
            label: Raspberry Pi Pico
            board: RPI_PICO
            folder: Pico
            asset: firmware_pico.uf2
          - id: picow
            label: Raspberry Pi Pico W
            board: RPI_PICO_W
            folder: Picow
            asset: firmware_pico_w.uf2
          - id: pico2
            label: Raspberry Pi Pico 2
            board: RPI_PICO2
            folder: Pico2
            asset: firmware_pico2.uf2
          - id: pico2w
            label: Raspberry Pi Pico 2 W
            board: RPI_PICO2_W
            folder: Pico2w
            asset: firmware_pico2_w.uf2

    steps:
      - name: Checkout pinned Pico frozen/RTA integration source
        uses: actions/checkout@v4
        with:
          repository: niwantha33/micropython_live_debugger
          ref: adc4d24777bca21817cf95d092511090ca76ff36
          persist-credentials: false

      - name: Resolve candidate source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install ARM toolchain and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake build-essential python3 git

      - name: Load pinned MicroPython revision
        run: |
          MICROPYTHON_REF="$(tr -d '[:space:]' < firmware/MICROPYTHON_REF)"
          test -n "$MICROPYTHON_REF"
          echo "MICROPYTHON_REF=$MICROPYTHON_REF" >> "$GITHUB_ENV"

      - name: Clone pinned MicroPython
        run: |
          git clone https://github.com/micropython/micropython.git "$HOME/micropython"
          cd "$HOME/micropython"
          git checkout --detach "$MICROPYTHON_REF"
          git submodule update --init --recursive
          make -C mpy-cross

      - name: Apply debugger patches
        run: |
          export MPY_DIR="$HOME/micropython"
          for p in firmware/patches/0*.sh; do
            echo ">> $p"
            bash "$p"
          done


      - name: Test frozen Pico bootstrap without hardware
        run: |
          python3 -m unittest discover -s rp2/tests -p 'test_*.py' -v
          python3 -m py_compile rp2/frozen/*.py

      - name: Install frozen Pico debugger (test candidate only)
        env:
          BOARD: ${{ matrix.board }}
        run: |
          set -euo pipefail
          BOARD_DIR="$HOME/micropython/ports/rp2/boards/$BOARD"
          MAIN_C="$HOME/micropython/ports/rp2/main.c"
          mkdir -p "$BOARD_DIR/mpy_studio_frozen"
          cp rp2/frozen/*.py "$BOARD_DIR/mpy_studio_frozen/"

          # Reuse exactly the already-tested Studio protocol-v5 pump.
          # Pin both its source commit and content hash: no silent latest drift.
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/niwantha33/micropython-studio/a62aa231ee15bec41de0a8f9a7bdc89bbbaae975/src/debugger_files/trace_pump.py \
            --output "$BOARD_DIR/mpy_studio_frozen/mpy_studio_pico_trace_pump.py"
          test "$(git hash-object "$BOARD_DIR/mpy_studio_frozen/mpy_studio_pico_trace_pump.py")" = \
            "f7bded9d6180849e9e92cdd9e06bca4c223ca2bc"
          grep -q 'PUMP_PROTOCOL = 5' "$BOARD_DIR/mpy_studio_frozen/mpy_studio_pico_trace_pump.py"
          grep -q 'PUMP_BUILD = "2026-10-07-rta-viewer-v5"' "$BOARD_DIR/mpy_studio_frozen/mpy_studio_pico_trace_pump.py"

          # Keep the original board manifest (including Wi-Fi/BLE packages).
          # Plain Pico/Pico2 have no board-specific manifest: include stock one.
          if [ ! -e "$BOARD_DIR/manifest.py" ]; then
            printf '%s\n' 'include("$(PORT_DIR)/boards/manifest.py")' > "$BOARD_DIR/manifest.py"
          fi
          cat >> "$BOARD_DIR/manifest.py" <<'MANIFEST'
          require("usb-device")
          require("usb-device-cdc")
          freeze("mpy_studio_frozen")
          MANIFEST

          # Phase 1: configure CDC1 immediately after stock filesystem init.
          # Phase 2: start the pump only after mp_usbd_init(), never in boot.
          python - "$MAIN_C" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          src = p.read_text()
          early = '        // Execute user scripts.\n        int ret = pyexec_file_if_exists("boot.py");'
          replacement = ('        // Frozen Studio debugger CDC setup, before user boot.py and USB init.\n'
                         '        pyexec_frozen_module("mpy_studio_pico_boot.py", false);\n\n'
                         + early)
          if src.count(early) != 1:
              raise SystemExit("Pico _boot/boot.py startup anchor was not unique")
          src = src.replace(early, replacement, 1)

          late = '        #if MICROPY_HW_ENABLE_USBDEV\n        mp_usbd_init();\n        #endif\n'
          new_late = ('        #if MICROPY_HW_ENABLE_USBDEV\n'
                      '        mp_usbd_init();\n'
                      '        pyexec_frozen_module("mpy_studio_pico_start.py", false);\n'
                      '        #endif\n')
          if src.count(late) != 1:
              raise SystemExit("Pico mp_usbd_init startup anchor was not unique")
          p.write_text(src.replace(late, new_late, 1))
          PY

      - name: Build firmware
        run: |
          set -euo pipefail
          cd "$HOME/micropython/ports/rp2"
          # Always use the patched board manifest; W boards explicitly
          # select their board manifest in mpconfigboard.cmake.
          FROZEN="$PWD/boards/${{ matrix.board }}/manifest.py"
          make BOARD=${{ matrix.board }} FROZEN_MANIFEST="$FROZEN" submodules
          make BOARD=${{ matrix.board }} FROZEN_MANIFEST="$FROZEN" -j4

      - name: Verify debugger capabilities in compiled UF2
        run: |
          UF2="$HOME/micropython/ports/rp2/build-${{ matrix.board }}/firmware.uf2"
          test -s "$UF2"
          # UF2 has per-record block boundaries; full QSTRs can straddle records.
          # Verify symbols in the matching linked ELF instead.
          ELF="$HOME/micropython/ports/rp2/build-${{ matrix.board }}/firmware.elf"
          test -s "$ELF"
          strings -a "$ELF" > "$RUNNER_TEMP/monday-firmware-strings.txt"
          for symbol in rta_on rta_off rta_names_on; do
            grep -Fxq "$symbol" "$RUNNER_TEMP/monday-firmware-strings.txt" || {
              echo "ERROR: linked ELF missing dbg.$symbol"; exit 1;
            }
          done
          for symbol in mpy_studio_pico_boot.py mpy_studio_pico_start.py 2026-10-07-rta-viewer-v5; do
            grep -Fq "$symbol" "$RUNNER_TEMP/monday-firmware-strings.txt" || {
              echo "ERROR: linked ELF missing frozen bootstrap/pump $symbol"; exit 1;
            }
          done
          echo "Verified frozen CDC bootstrap, protocol-v5 pump and RTA exports for ${{ matrix.board }}"

      - name: Stage firmware artifact
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_BRANCH: fix/pico-frozen-rta-integration-candidate
        run: |
          mkdir -p "out/${{ matrix.folder }}"
          UF2="out/${{ matrix.folder }}/${{ matrix.asset }}"
          cp "$HOME/micropython/ports/rp2/build-${{ matrix.board }}/firmware.uf2" "$UF2"
          SHA256="$(sha256sum "$UF2" | awk '{print $1}')"
          {
            echo "source_commit: ${SOURCE_SHA}"
            echo "source_branch: ${SOURCE_BRANCH}"
            echo "workflow_commit: ${GITHUB_SHA}"
            echo "micropython_commit: ${MICROPYTHON_REF}"
            echo "board: ${{ matrix.board }}"
            echo "built_at: $(date -u +%FT%TZ)"
            echo "sha256: ${SHA256}"
            echo "rta_api: dbg.rta_on,dbg.rta_off,dbg.rta_names_on"
            echo "rta_names_frame: 0x07-opt-in-crc16"
            echo "transport: PICO_CDC0=REPL_UPLOAD,PICO_CDC1=DEBUGGER"
            echo "bootstrap: frozen-pico-two-phase"
            echo "pump_protocol: 5"
            echo "pump_build: 2026-10-07-rta-viewer-v5"
            echo "pump_source_commit: a62aa231ee15bec41de0a8f9a7bdc89bbbaae975"
            echo "pump_source_blob: f7bded9d6180849e9e92cdd9e06bca4c223ca2bc"
          } > "out/${{ matrix.folder }}/VERSION.txt"

      - name: Upload test firmware
        uses: actions/upload-artifact@v4
        with:
          name: weekly-candidate-${{ matrix.id }}-frozen-UNVALIDATED
          path: out/
          if-no-files-found: error
          retention-days: 14


  s3-candidate:
    name: Build ESP32-S3 debugger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pinned ESP32-S3 candidate source
        uses: actions/checkout@v4
        with:
          repository: niwantha33/micropython_live_debugger
          ref: bafa3c5aac7fa9a83bafdfa9f7c53f997292c0f4
          persist-credentials: false

      - name: Resolve candidate source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Load pinned MicroPython revision
        run: |
          MICROPYTHON_REF="$(tr -d '[:space:]' < firmware/MICROPYTHON_REF)"
          test -n "$MICROPYTHON_REF"
          echo "MICROPYTHON_REF=$MICROPYTHON_REF" >> "$GITHUB_ENV"

      - name: Clone pinned MicroPython
        run: |
          git clone https://github.com/micropython/micropython.git micropython
          cd micropython
          git checkout --detach "$MICROPYTHON_REF"
          git submodule update --init --recursive
          make -C mpy-cross

      - name: Apply debugger core patches
        run: |
          export MPY_DIR="$GITHUB_WORKSPACE/micropython"
          for p in firmware/patches/0*.sh; do
            echo ">> $p"
            bash "$p"
          done

      - name: Install frozen dual-CDC debugger modules
        run: |
          BOARD_DIR="$GITHUB_WORKSPACE/micropython/ports/esp32/boards/ESP32_GENERIC_S3"
          STOCK_BOOT="$GITHUB_WORKSPACE/micropython/ports/esp32/modules/_boot.py"
          MAIN_C="$GITHUB_WORKSPACE/micropython/ports/esp32/main.c"
          rm -rf "$BOARD_DIR/debugger_frozen"
          cp -R esp32/frozen "$BOARD_DIR/debugger_frozen"
          cp esp32/manifest.py "$BOARD_DIR/manifest_debugger.py"

          # Phase 1: descriptor setup before mp_usbd_init().
          {
            echo
            echo "# MicroPython Studio USB descriptor bootstrap"
            echo "import mpy_studio_boot"
          } >> "$STOCK_BOOT"

          # Phase 2: start the debugger thread only after TinyUSB is fully
          # initialised. This preserves CDC0 raw REPL/file upload stability.
          python - "$MAIN_C" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          text = p.read_text()
          old = "    #if MICROPY_HW_ENABLE_USBDEV\n    mp_usbd_init();\n    #endif\n"
          new = "    #if MICROPY_HW_ENABLE_USBDEV\n    mp_usbd_init();\n    pyexec_frozen_module(\"mpy_studio_start.py\", false);\n    #endif\n"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one ESP32 mp_usbd_init startup block")
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Build MicroPython for ESP32-S3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: micropython/ports/esp32
          command: make BOARD=ESP32_GENERIC_S3 FROZEN_MANIFEST="$PWD/boards/ESP32_GENERIC_S3/manifest_debugger.py" submodules && make BOARD=ESP32_GENERIC_S3 FROZEN_MANIFEST="$PWD/boards/ESP32_GENERIC_S3/manifest_debugger.py" -j4

      - name: Verify debugger API in ESP32-S3 image
        run: |
          BUILD="$GITHUB_WORKSPACE/micropython/ports/esp32/build-ESP32_GENERIC_S3"
          test -s "$BUILD/firmware.bin"
          strings -a "$BUILD/firmware.bin" | grep -Fxq 'rta_on' || { echo "ERROR: missing dbg.rta_on"; exit 1; }
          strings -a "$BUILD/firmware.bin" | grep -Fxq 'rta_off' || { echo "ERROR: missing dbg.rta_off"; exit 1; }
          strings -a "$BUILD/firmware.bin" | grep -Fxq 'set_bp' || { echo "ERROR: missing dbg.set_bp"; exit 1; }
          strings -a "$BUILD/firmware.bin" | grep -Fxq 'clear_bp' || { echo "ERROR: missing dbg.clear_bp"; exit 1; }
          strings -a "$BUILD/firmware.bin" | grep -Fq 'MicroPython Studio ESP32-S3 Debug' || { echo "ERROR: missing frozen native debugger bootstrap"; exit 1; }
          strings -a "$BUILD/firmware.bin" | grep -Fq 'mpy_studio_start.py' || { echo "ERROR: missing late debugger-start hook"; exit 1; }
          strings -a "$BUILD/firmware.bin" | grep -Fq 'usb-device-cdc' || true

      - name: Stage ESP32-S3 test firmware
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_BRANCH: feature/esp32-s3-debugger-v1
        run: |
          BUILD="$GITHUB_WORKSPACE/micropython/ports/esp32/build-ESP32_GENERIC_S3"
          OUT="$GITHUB_WORKSPACE/out/ESP32S3"
          mkdir -p "$OUT"
          cp "$BUILD/firmware.bin" "$OUT/firmware_esp32s3.bin"
          cp "$BUILD/micropython.uf2" "$OUT/micropython_esp32s3.uf2" 2>/dev/null || true
          cp "$BUILD/bootloader/bootloader.bin" "$OUT/bootloader.bin"
          cp "$BUILD/partition_table/partition-table.bin" "$OUT/partition-table.bin"
          cp "$BUILD/micropython.bin" "$OUT/micropython.bin"
          cp esp32/README.md "$OUT/TESTING.md"
          SHA256="$(sha256sum "$OUT/firmware_esp32s3.bin" | awk '{print $1}')"
          {
            echo "source_commit: $SOURCE_SHA"
            echo "source_branch: $SOURCE_BRANCH"
            echo "micropython_commit: $MICROPYTHON_REF"
            echo "esp_idf: v5.5.5"
            echo "board: ESP32_GENERIC_S3"
            echo "transport: serial-jtag-repl-plus-native-usb-debugger"
            echo "usb_layout: SERIAL_JTAG=REPL_UPLOAD,NATIVE_CDC=DEBUGGER"
            echo "studio_trace_pump_commit: a62aa231ee15bec41de0a8f9a7bdc89bbbaae975"
            echo "built_at: $(date -u +%FT%TZ)"
            echo "sha256: $SHA256"
            echo "debug_api: set_bp,clear_bp,step,step_in,step_out,locals,call_stack"
            echo "rta_api: dbg.rta_on,dbg.rta_off"
          } > "$OUT/VERSION.txt"

      - name: Upload ESP32-S3 test firmware
        uses: actions/upload-artifact@v4
        with:
          name: weekly-candidate-esp32s3-UNVALIDATED
          path: out/
          if-no-files-found: error
          retention-days: 14

  publish-test-downloads:
    name: Update GitHub TestBuilds downloads
    needs: [frozen-pico, s3-candidate]
    # Manual/push CI is build-only. Never replace public downloads on those events.
    if: ${{ github.event_name == 'schedule' && needs.frozen-pico.result == 'success' && needs.s3-candidate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout firmware download repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download all five verified candidate artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: weekly-candidate-*
          path: staged
          merge-multiple: true

      - name: Validate and stage board-specific downloads
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "schedule" || { echo "Only Mondays may publish"; exit 1; }
          for entry in "Pico:firmware_pico.uf2:RPI_PICO" "Picow:firmware_pico_w.uf2:RPI_PICO_W" "Pico2:firmware_pico2.uf2:RPI_PICO2" "Pico2w:firmware_pico2_w.uf2:RPI_PICO2_W"; do
            IFS=: read -r folder binary board <<< "$entry"
            file="staged/$folder/$binary"
            version="staged/$folder/VERSION.txt"
            test -s "$file" && test -s "$version"
            grep -Fxq "board: $board" "$version"
            grep -Fxq 'source_branch: fix/pico-frozen-rta-integration-candidate' "$version"
            grep -Fxq 'source_commit: adc4d24777bca21817cf95d092511090ca76ff36' "$version"
            grep -Fxq 'rta_names_frame: 0x07-opt-in-crc16' "$version"
            grep -Fxq 'bootstrap: frozen-pico-two-phase' "$version"
            sha="$(sha256sum "$file" | cut -d' ' -f1)"
            grep -Fxq "sha256: $sha" "$version"
          done

          test -s staged/ESP32S3/firmware_esp32s3.bin
          test -s staged/ESP32S3/VERSION.txt
          test -s staged/ESP32S3/bootloader.bin
          test -s staged/ESP32S3/partition-table.bin
          grep -Fxq 'board: ESP32_GENERIC_S3' staged/ESP32S3/VERSION.txt
          grep -Fxq 'source_branch: feature/esp32-s3-debugger-v1' staged/ESP32S3/VERSION.txt
          grep -Fxq 'source_commit: bafa3c5aac7fa9a83bafdfa9f7c53f997292c0f4' staged/ESP32S3/VERSION.txt
          grep -Fxq 'transport: serial-jtag-repl-plus-native-usb-debugger' staged/ESP32S3/VERSION.txt
          sha="$(sha256sum staged/ESP32S3/firmware_esp32s3.bin | cut -d' ' -f1)"
          grep -Fxq "sha256: $sha" staged/ESP32S3/VERSION.txt

          # Replace ONLY experimental TestBuilds. Never overwrite stable
          # Pico/, Pico2w/, ESP32S3/ or any approved VERSION.txt.
          for board in Pico Picow Pico2 Pico2w ESP32S3; do
            mkdir -p "TestBuilds/$board"
            cp -a "staged/$board/." "TestBuilds/$board/"
          done
          printf 'workflow_run: %s\nbuilt_from: %s\nstatus: EXPERIMENTAL_NOT_HARDWARE_VALIDATED\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > TestBuilds/BUILD_INFO.txt

          python3 - <<'PY'
          import json
          from pathlib import Path
          names = {
              "pico": ("Pico", "firmware_pico.uf2"),
              "picow": ("Picow", "firmware_pico_w.uf2"),
              "pico2": ("Pico2", "firmware_pico2.uf2"),
              "pico2w": ("Pico2w", "firmware_pico2_w.uf2"),
              "esp32-s3": ("ESP32S3", "firmware_esp32s3.bin"),
          }
          root = Path("TestBuilds")
          boards = {}
          for board_id, (folder, filename) in names.items():
              version = {}
              for line in (root / folder / "VERSION.txt").read_text().splitlines():
                  if ": " in line:
                      key, value = line.split(": ", 1)
                      version[key] = value
              boards[board_id] = {
                  "path": str(root / folder / filename),
                  "source_commit": version.get("source_commit"),
                  "built_at": version.get("built_at"),
                  "sha256": version.get("sha256"),
                  "hardware_validated": False,
              }
          (root / "LATEST.json").write_text(
              json.dumps({"channel": "TEST_ONLY", "boards": boards}, indent=2) + "\n"
          )
          PY

      - name: Commit latest TEST firmware to GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "firmware-ci"
          git config user.email "firmware-ci@users.noreply.github.com"
          git add TestBuilds/
          if git diff --cached --quiet; then
            echo "TestBuilds already matches latest verified artifacts."
            exit 0
          fi
          git commit -m "testfirmware: refresh five experimental board downloads"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "### Latest TEST firmware is in [TestBuilds](https://github.com/niwantha33/micropython_live_dbg_firmware/tree/main/TestBuilds)." >> "$GITHUB_STEP_SUMMARY"
