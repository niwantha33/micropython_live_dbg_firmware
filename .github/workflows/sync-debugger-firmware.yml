name: Weekly validated Pico debugger build

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 03:17 UTC. Scheduled runs build all four Pico UF2s.
    - cron: '17 3 * * 1'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-debugger-firmware.yml'
      - '.github/approved-pico-source.sha'

concurrency:
  group: sync-debugger-firmware
  cancel-in-progress: false

jobs:
  check:
    name: Check source revision
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.state.outputs.source_sha }}
      needs_publish: ${{ steps.state.outputs.needs_publish }}
    steps:
      - name: Checkout firmware repository
        uses: actions/checkout@v4

      - name: Check hardware-approved Pico source against published versions
        id: state
        shell: bash
        run: |
          set -euo pipefail
          # Intentional release gate. Do NOT track source main HEAD:
          # docs-only merges and experimental branches must not publish firmware.
          SOURCE_SHA="$(tr -d '[:space:]' < .github/approved-pico-source.sha)"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid approved source SHA" >&2
            exit 1
          fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          need=false
          for board in Pico Picow Pico2 Pico2w; do
            current="$(awk -F': ' '$1 == "source_commit" {print $2}' "$board/VERSION.txt" 2>/dev/null || true)"
            if [ "$current" != "$SOURCE_SHA" ]; then
              need=true
              echo "$board requires an approved promotion: ${current:-none} -> $SOURCE_SHA"
            else
              echo "$board already publishes approved commit ${SOURCE_SHA:0:12}"
            fi
          done
          echo "needs_publish=$need" >> "$GITHUB_OUTPUT"
          echo "### Weekly Pico firmware build" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned, approved source: \`$SOURCE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Promotion required: \`$need\` (builds run even when false)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.label }}
    needs: check
    # Always build weekly, even when binaries are already at the approved SHA.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: pico
            label: Raspberry Pi Pico
            board: RPI_PICO
            folder: Pico
            asset: firmware_pico.uf2
          - id: picow
            label: Raspberry Pi Pico W
            board: RPI_PICO_W
            folder: Picow
            asset: firmware_pico_w.uf2
          - id: pico2
            label: Raspberry Pi Pico 2
            board: RPI_PICO2
            folder: Pico2
            asset: firmware_pico2.uf2
          - id: pico2w
            label: Raspberry Pi Pico 2 W
            board: RPI_PICO2_W
            folder: Pico2w
            asset: firmware_pico2_w.uf2

    env:
      SOURCE_SHA: ${{ needs.check.outputs.source_sha }}

    steps:
      - name: Checkout debugger source
        uses: actions/checkout@v4
        with:
          repository: niwantha33/micropython_live_debugger
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false

      - name: Load pinned MicroPython revision
        run: |
          MICROPYTHON_REF="$(tr -d '[:space:]' < source/firmware/MICROPYTHON_REF)"
          test -n "$MICROPYTHON_REF"
          echo "MICROPYTHON_REF=$MICROPYTHON_REF" >> "$GITHUB_ENV"

      - name: Install ARM toolchain and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake build-essential python3 git

      - name: Clone pinned MicroPython
        run: |
          git clone https://github.com/micropython/micropython.git "$HOME/micropython"
          cd "$HOME/micropython"
          git checkout --detach "$MICROPYTHON_REF"
          git submodule update --init --recursive
          make -C mpy-cross

      - name: Apply debugger patches
        run: |
          export MPY_DIR="$HOME/micropython"
          for p in source/firmware/patches/0*.sh; do
            echo ">> $p"
            bash "$p"
          done

      - name: Build firmware
        run: |
          cd "$HOME/micropython/ports/rp2"
          make BOARD=${{ matrix.board }} submodules
          make BOARD=${{ matrix.board }} -j4

      - name: Verify debugger capabilities
        run: |
          set -euo pipefail
          UF2="$HOME/micropython/ports/rp2/build-${{ matrix.board }}/firmware.uf2"
          test -s "$UF2"
          test "$(stat -c%s "$UF2")" -gt 100000
          strings -a "$UF2" | grep -Fxq 'rta_on'  || { echo "ERROR: missing dbg.rta_on"; exit 1; }
          strings -a "$UF2" | grep -Fxq 'rta_off' || { echo "ERROR: missing dbg.rta_off"; exit 1; }

      - name: Stage firmware
        run: |
          mkdir -p "out/${{ matrix.folder }}"
          UF2="out/${{ matrix.folder }}/${{ matrix.asset }}"
          cp "$HOME/micropython/ports/rp2/build-${{ matrix.board }}/firmware.uf2" "$UF2"
          SHA256="$(sha256sum "$UF2" | awk '{print $1}')"
          {
            echo "source_commit: $SOURCE_SHA"
            echo "source_branch: approved-pico-commit"
            echo "release_channel: stable-approved"
            echo "micropython_commit: $MICROPYTHON_REF"
            echo "board: ${{ matrix.board }}"
            echo "built_at: $(date -u +%FT%TZ)"
            echo "sha256: $SHA256"
            echo "rta_api: dbg.rta_on,dbg.rta_off"
          } > "out/${{ matrix.folder }}/VERSION.txt"

      - name: Upload staged firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.id }}
          path: out/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish firmware
    needs:
      - check
      - build
    # Publish ONLY when an explicitly approved SHA is different from the
    # currently published source and ALL four builds/verification jobs passed.
    # Even approved source promotions publish only on the Monday schedule.
    # Manual/push runs may validate and stage artifacts, never change downloads.
    if: github.event_name == 'schedule' && needs.check.outputs.needs_publish == 'true' && needs.build.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
    steps:
      - name: Checkout firmware repository
        uses: actions/checkout@v4

      - name: Download staged firmware
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: staged
          merge-multiple: true

      - name: Commit firmware update
        shell: bash
        run: |
          set -euo pipefail
          # Guard the public download channel: never promote S3/C3/test builds.
          for entry in "Pico:firmware_pico.uf2:RPI_PICO" "Picow:firmware_pico_w.uf2:RPI_PICO_W" "Pico2:firmware_pico2.uf2:RPI_PICO2" "Pico2w:firmware_pico2_w.uf2:RPI_PICO2_W"; do
            IFS=: read -r folder asset board <<< "$entry"
            version="staged/$folder/VERSION.txt"
            uf2="staged/$folder/$asset"
            test -s "$version"
            test -s "$uf2"
            grep -Fxq "source_commit: $SOURCE_SHA" "$version"
            grep -Fxq "board: $board" "$version"
            grep -Fxq 'release_channel: stable-approved' "$version"
            expected="$(awk -F': ' '$1 == "sha256" {print $2}' "$version")"
            actual="$(sha256sum "$uf2" | awk '{print $1}')"
            test -n "$expected" && test "$expected" = "$actual" || {
              echo "Checksum mismatch for $folder" >&2
              exit 1
            }
          done
          cp -R staged/Pico staged/Picow staged/Pico2 staged/Pico2w ./
          git config user.email "bot@niwantha33.local"
          git config user.name "firmware-bot"
          git add Pico/ Picow/ Pico2/ Pico2w/
          if git diff --cached --quiet; then
            echo "No firmware changes to publish"
            exit 0
          fi
          git commit -m "release(pico): approved debugger firmware ${SOURCE_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
